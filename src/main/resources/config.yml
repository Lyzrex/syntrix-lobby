# ==========================================================
# Syntrix-Lobby — Main Configuration
# ==========================================================

prefix:
  enabled: true

lobby:
  world: Lobby
  spawn:
    x: 0.5
    y: 30.0
    z: 0.5
    yaw: 179.66777
    pitch: -1.6788139

join:
  teleport-to-spawn:
    enabled: true
    allow-player-toggle: true
  clear-inventory: true

protections:
  block-pvp: true
  block-doors: true
  block-trapdoors: true
  block-fence-gates: true
  block-hoppers: true
  block-barrels: true
  block-flower-pots: true
  block-note-blocks: true
  block-jukebox: true
  protect-farmland: true
  no-fall-damage: true
  no-hunger: true
  deathHeight: -64
  bypass-permission: syntrix.protections.bypass

chat:
  enabled: true
  permission: syntrix.chat.hex

signs:
  enabled: true
  permission: syntrix.signs.color
  allow-minimessage: true
  allow-hex: true
  filter-empty-lines: false

# ----------------------------------------------------------
# Navigator GUI (Lythrion Design & Neue Items)
# ----------------------------------------------------------
navigator:
  enabled: true

  gui:
    rows: 5
    filler:
      enabled: true
      pattern:
        - "111121111"
        - "1.......1"
        - "2.......2"
        - "1.......1"
        - "111121111"
      map:
        "1": { material: BLACK_STAINED_GLASS_PANE, name: " " }
        "2": { material: GRAY_STAINED_GLASS_PANE, name: " " }

  trigger:
    material: RECOVERY_COMPASS
    slot: 4

  sounds:
    open: UI_BUTTON_CLICK
    click: BLOCK_NOTE_BLOCK_BELL
    volume: 0.8
    pitch-open: 1.2
    pitch-click: 1.6

  servers:
    - slot: 20
      material: DIAMOND_PICKAXE
      server: citybuild
      name: "<gradient:#2AF598:#009EFD><bold>CityBuild RPG</bold></gradient>"
      lore:
        - ""
        - "<#8799ae>Claim your land, level up skills,"
        - "<#8799ae>and build your very own empire."
        - ""
        - "<#8799ae>Status: <#2AF598>Online"
        - ""
        - "<#EEDD44>➤ Click to Connect"

    - slot: 22
      material: OAK_SAPLING
      server: skyblock
      name: "<gradient:#FFD700:#FFA500><bold>SkyBlock</bold></gradient>"
      lore:
        - ""
        - "<#8799ae>Start on a small island and"
        - "<#8799ae>expand it to a massive kingdom."
        - ""
        - "<#8799ae>Status: <#FF4D4F>Maintenance"
        - ""
        - "<#FF4D4F>➤ Currently Unavailable"

    - slot: 24
      material: END_CRYSTAL
      server: coredash
      name: "<gradient:#D580FF:#AA00FF><bold>Core-Dash</bold></gradient>"
      lore:
        - ""
        - "<#8799ae>A fast-paced minigame where"
        - "<#8799ae>every second counts."
        - ""
        - "<#8799ae>Status: <#FF4D4F>Maintenance"
        - ""
        - "<#FF4D4F>➤ Currently Unavailable"

    - slot: 40
      material: PLAYER_HEAD
      server: discord
      name: "<gradient:#5865F2:#7289DA><bold>Discord</bold></gradient>"
      lore:
        - ""
        - "<#8799ae>Join our community!"
        - "<#5865F2>https://discord.gg/H998F9MxwX"
        - ""
        - "<#EEDD44>➤ Click to get Link"

doublejump:
  enabled: true
  permission: ""
  cooldown-seconds: 1.0
  sound: ENTITY_FIREWORK_ROCKET_LAUNCH
  volume: 0.8
  pitch: 1.2

fly:
  enabled: true
  permission: syntrix.fly
  others-permission: syntrix.fly.others
  messages: true
  auto-on-join:
    enabled: true
    permission: syntrix.fly.auto

build:
  enabled: true
  permission: syntrix.build
  clear-on-disable: true

commands:
  spawn:       { enabled: true, permission: syntrix.spawn }
  setspawn:    { enabled: true, permission: syntrix.setspawn }
  lobbyreload: { enabled: true, permission: syntrix.reload }
  build:       { enabled: true, permission: syntrix.build }
  setheight:   { enabled: true, permission: syntrix.setheight }
  skull:       { enabled: true, permission: syntrix.skull }
  time:        { enabled: true, permission: syntrix.time }

timeControl:
  enabled: true
  world: ""
  fixed-time: 1000
  intervalTicks: 200
  freeze: true

weatherControl:
  enabled: true
  world: ""
  intervalTicks: 200
  lock-sun: true

spawnParticles:
  enabled: true
  type: SPELL_WITCH
  radius: 1.5
  points: 60
  intervalTicks: 5

player-data:
  enabled: true
  folder: player-data
  track-last-quit: true

skull:
  enabled: true
  permission: syntrix.skull

vanish:
  enabled: true
  permission: syntrix.vanish
  see-permission: syntrix.vanish.see
  auto:
    enabled: true
    permission: syntrix.vanish.auto
  suppress-join-quit: true

welcome:
  enabled: true
  join: { enabled: true }
  quit: { enabled: true }
  firstJoin:
    enabled: true
    broadcast: true
    firework: true
    particles: true

effects:
  enabled: true
  title:
    enabled: true
    fadeInMs: 500
    stayMs: 2500
    fadeOutMs: 800
  sound:
    enabled: true
    volume: 1.0
    pitch: 1.2
  particles:
    enabled: true
    count: 40
    offset: { x: 0.5, y: 0.5, z: 0.5 }
    speed: 0.02

jumppads:
  enabled: true
  world: Lobby
  cooldown-ticks: 10
  triggers:
    use-pressure-plates: true
    materials: []
  velocity:
    use-look-direction: true
    horizontal: 1.2
    vertical: 1.0
    cap: 3.5
  particles:
    enabled: true
    type: CLOUD
    count: 20
    offset: { x: 0.2, y: 0.4, z: 0.2 }
    speed: 0.01
    at: player
  sound:
    enabled: true
    type: ENTITY_FIREWORK_ROCKET_LAUNCH
    volume: 0.6
    pitch: 1.4

items:
  jumpAndRun:
    enabled: true
    permission: ''
    slot: 1
    activator-material: SLIME_BALL
    block-material: LIGHT_BLUE_STAINED_GLASS
    steps: 40
    cancel-fall-below: 1.5
    checkpoints: [1, 15, 25]
    difficulties:
      easy:   { range: [1, 12],  distance: 1.8, height: 0.7 }
      medium: { range: [15, 24], distance: 2.4, height: 0.8 }
      hard:   { range: [25, 40], distance: 3.3, height: 0.9 }
    sounds:
      start: block.note_block.pling
      step: block.note_block.hat
      finish: ui.toast.challenge_complete
      cancel: entity.armor_stand.break
      checkpoint: block.note_block.bell
      fail: entity.villager.no
      volume: 1.5
      pitch: 1.5
    leaderboard:
      permission: syntrix.jumpandrun.hologram
      spacing: 0.3