# ==========================================================
# Syntrix-Lobby — Main Configuration
# ==========================================================

prefix:
  enabled: true

# ----------------------------------------------------------
# Lobby Spawn & Player Handling
# ----------------------------------------------------------
lobby:
  world: Lobby
  spawn:
    x: 0.5
    y: 30.0
    z: 0.5
    yaw: 179.66777
    pitch: -1.6788139

join:
  teleport-to-spawn:
    enabled: true
    allow-player-toggle: true
  clear-inventory: true

# ----------------------------------------------------------
# Protections
# Gilt für: InteractionGuard, Hunger, etc.
# ----------------------------------------------------------
protections:
  block-pvp: true
  block-doors: true
  block-trapdoors: true
  block-fence-gates: true
  block-hoppers: true
  block-barrels: true
  block-flower-pots: true
  block-note-blocks: true
  block-jukebox: true
  protect-farmland: true
  no-fall-damage: true
  no-hunger: true
  deathHeight: -64
  bypass-permission: syntrix.protections.bypass

# ----------------------------------------------------------
# Chat — HexColor & (optional) MiniMessage im Chat
# ----------------------------------------------------------
chat:
  enabled: true
  permission: syntrix.chat.hex

# ----------------------------------------------------------
# Sign System (Farben & MiniMessage auf Schildern)
# ----------------------------------------------------------
signs:
  enabled: true
  permission: syntrix.signs.color
  allow-minimessage: true
  allow-hex: true
  filter-empty-lines: false

# ----------------------------------------------------------
# Navigator GUI
# ----------------------------------------------------------
navigator:
  enabled: true

  gui:
    rows: 3
    filler:
      enabled: true
      pattern:
        - "123.5.789"
        - "1..456..9"
        - "123.5.789"
      map:
        "1": { material: BLUE_STAINED_GLASS_PANE, name: "" }
        "2": { material: BLUE_STAINED_GLASS_PANE, name: "" }
        "3": { material: RED_STAINED_GLASS_PANE,  name: "" }
        "4": { material: BLUE_STAINED_GLASS_PANE, name: "" }
        "5": { material: BLUE_STAINED_GLASS_PANE, name: "" }
        "6": { material: BLUE_STAINED_GLASS_PANE, name: "" }
        "7": { material: RED_STAINED_GLASS_PANE,  name: "" }
        "8": { material: BLUE_STAINED_GLASS_PANE, name: "" }
        "9": { material: BLUE_STAINED_GLASS_PANE, name: "" }

  trigger:
    material: COMPASS
    slot: 4

  sounds:
    open: UI_BUTTON_CLICK
    click: BLOCK_NOTE_BLOCK_BELL
    volume: 0.8
    pitch-open: 1.2
    pitch-click: 1.6

  servers:
    - slot: 13
      material: NETHERITE_SCRAP
      server: skyblock
      name: "<gradient:#2AF598:#009EFD><bold>SkyBlock</bold>"
      lore:
        - "<#8799ae>Click to travel to"
        - "<#2AF598>skyblock"

# ----------------------------------------------------------
# Double Jump
# ----------------------------------------------------------
doublejump:
  enabled: true
  permission: ""             # leer => keine Permission nötig
  cooldown-seconds: 1.0
  sound: ENTITY_FIREWORK_ROCKET_LAUNCH
  volume: 0.8
  pitch: 1.2

# ----------------------------------------------------------
# Flight
# ----------------------------------------------------------
fly:
  enabled: true
  permission: syntrix.fly
  others-permission: syntrix.fly.others
  messages: true
  auto-on-join:
    enabled: true
    permission: syntrix.fly.auto

# ----------------------------------------------------------
# Build Mode
# ----------------------------------------------------------
build:
  enabled: true
  permission: syntrix.build
  clear-on-disable: true

# ----------------------------------------------------------
# Commands (Permissions)
# ----------------------------------------------------------
commands:
  spawn:       { enabled: true, permission: syntrix.spawn }
  setspawn:    { enabled: true, permission: syntrix.setspawn }
  lobbyreload: { enabled: true, permission: syntrix.reload }
  build:       { enabled: true, permission: syntrix.build }
  setheight:   { enabled: true, permission: syntrix.setheight }
  skull:       { enabled: true, permission: syntrix.skull }
  time:        { enabled: true, permission: syntrix.time }


# ----------------------------------------------------------
# TimeKeeperTask
# ----------------------------------------------------------
timeControl:
  enabled: true
  world: ""
  fixed-time: 1000
  intervalTicks: 200
  freeze: true

  # ----------------------------------------------------------
  # Weather
  # ----------------------------------------------------------
  weatherControl:
    enabled: true
    world: ""
    intervalTicks: 200
    lock-sun: true


# ----------------------------------------------------------
# Partikel-Ring am Spawn (SpawnParticleRingTask)
# ----------------------------------------------------------
spawnParticles:
  enabled: true
  type: SPELL_WITCH
  radius: 1.5
  points: 60
  intervalTicks: 5

# ----------------------------------------------------------
# Player Logging (dateibasiert für WelcomeListener)
# ----------------------------------------------------------
player-data:
  enabled: true
  folder: player-data
  track-last-quit: true


# ----------------------------------------------------------
# Death Logging
# ----------------------------------------------------------
deathLogs:
  enabled: true
  time-format: 'yyyy-MM-dd HH:mm:ss'
  coordinate-precision: 1
  console:
    enabled: true
    format: '[Death] {time} {player} died in {world} at {x}, {y}, {z} ({cause})'
  chat:
    enabled: true
    permission: ''
    message: '<gray>[Death]</gray> <red>{player}</red> <gray>starb bei</gray> <yellow>{x}</yellow> <gray>, {y}, {z}</gray> <gray>in {world}</gray> <gray>({time})</gray>'


# ----------------------------------------------------------
# Skull System
# ----------------------------------------------------------
skull:
  enabled: true
  permission: syntrix.skull

# ----------------------------------------------------------
# Vanish System
# ----------------------------------------------------------
vanish:
  enabled: true
  permission: syntrix.vanish
  see-permission: syntrix.vanish.see
  auto:
    enabled: true
    permission: syntrix.vanish.auto
  suppress-join-quit: true

# ----------------------------------------------------------
# Join / Quit / First Join & Effekte
# ----------------------------------------------------------
welcome:
  enabled: true
  join: { enabled: true }
  quit: { enabled: true }
  firstJoin:
    enabled: true
    broadcast: true
    firework: true
    particles: true

effects:
  enabled: true
  title:
    enabled: true
    fadeInMs: 500
    stayMs: 2500
    fadeOutMs: 800
  sound:
    enabled: true
    volume: 1.0
    pitch: 1.2
  particles:
    enabled: true
    count: 40
    offset: { x: 0.5, y: 0.5, z: 0.5 }
    speed: 0.02

# ----------------------------------------------------------
# JumpPads
# ----------------------------------------------------------
jumppads:
  enabled: true
  world: Lobby
  cooldown-ticks: 10

  triggers:
    use-pressure-plates: true
    materials: []

  velocity:
    use-look-direction: true
    horizontal: 1.2
    vertical: 1.0
    cap: 3.5

  particles:
    enabled: true
    type: CLOUD
    count: 20
    offset: { x: 0.2, y: 0.4, z: 0.2 }
    speed: 0.01
    at: player             # 'player' oder 'plate'

  sound:
    enabled: true
    type: ENTITY_FIREWORK_ROCKET_LAUNCH
    volume: 0.6
    pitch: 1.4

  message:
    enabled: false
    actionbar: true

# ----------------------------------------------------------
# Player Hider
# ----------------------------------------------------------
playerHider:
  enabled: true
  vip-permission: syntrix.vip
  exempt-permission: syntrix.hider.exempt
  default: ALL

  item:
    material: NETHER_STAR
    slot: 7
    cooldownMs: 300

  gui:
    filler:
      enabled: true
      pattern:
        - "122222221"
      map:
        "1": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "2": { material: BLUE_STAINED_GLASS_PANE, name: "" }
    sound:
      open:   { enabled: true, type: UI_BUTTON_CLICK,        volume: 0.8, pitch: 1.2 }
      select: { enabled: true, type: BLOCK_NOTE_BLOCK_BELL,  volume: 0.9, pitch: 1.5 }

# ----------------------------------------------------------
# Gadgets (Platzhalter; nur verwenden, wenn du die Implementierung hast)
# ----------------------------------------------------------
gadgets:
  enabled: true
  fixed-slots: { firework: 8, snowball: 0, hook: 2 }
  cooldown:    { firework: 4000, snowball: 1500, hook: 1200 }
  gui:
    filler:
      enabled: true
      pattern: [ "123456789" ]
      map:
        "1": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "2": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "3": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "4": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "5": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "6": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "7": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "8": { material: GRAY_STAINED_GLASS_PANE, name: "" }
        "9": { material: GRAY_STAINED_GLASS_PANE, name: "" }
    sound:
      open:   { enabled: true, type: UI_BUTTON_CLICK,       volume: 0.8, pitch: 1.2 }
      select: { enabled: true, type: BLOCK_NOTE_BLOCK_BELL, volume: 0.9, pitch: 1.5 }
  use:
    sound: { enabled: true, type: UI_BUTTON_CLICK, volume: 0.8, pitch: 1.0 }
  hotbar:
    firework: { material: FIREWORK_ROCKET }
    snowball: { material: SNOWBALL }
    hook:     { material: FISHING_ROD }
  firework:
    boost: 1.2
    power: 1
    color: AQUA
    flicker: true
    trail: true
    sound: ENTITY_FIREWORK_ROCKET_LAUNCH
  snowball:
    amount: 3
    spread: 0.1
    knockback: 1.1
    sound: ENTITY_SNOWBALL_THROW
  hook:
    pull: { power: 1.4, maxY: 0.7 }
  sound: ENTITY_FISHING_BOBBER_THROW

# ----------------------------------------------------------
# Items
# ----------------------------------------------------------
items:
  jumpAndRun:
    enabled: true
    permission: ''
    slot: 1
    activator-material: SLIME_BALL
    block-material: LIGHT_BLUE_STAINED_GLASS
    steps: 40
    cancel-fall-below: 1.5
    checkpoints: [1, 15, 25]
    difficulties:
      easy:   { range: [1, 12],  distance: 1.8, height: 0.7 }
      medium: { range: [15, 24], distance: 2.4, height: 0.8 }
      hard:   { range: [25, 40], distance: 3.3, height: 0.9 }
    sounds:
      start: block.note_block.pling
      step: block.note_block.hat
      finish: ui.toast.challenge_complete
      cancel: entity.armor_stand.break
      checkpoint: block.note_block.bell
      fail: entity.villager.no
      volume: 1.5
      pitch: 1.5
    leaderboard:
      permission: syntrix.jumpandrun.hologram
      spacing: 0.3