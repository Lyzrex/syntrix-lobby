# ===========================================================
# Syntrix-Lobby — Messages (EN)
# ===========================================================

prefix:
  enabled: true
  text: '<gradient:#2AF598:#009EFD>Syntrix</gradient> <#8799ae>• '

# ----------------------------------------------------------
# Build Mode
# ----------------------------------------------------------
build:
  enabled: '<#8799ae>Build mode <#2AF598>enabled</#2AF598><#8799ae>.'
  disabled: '<#8799ae>Build mode <#FF4D4F>disabled</#FF4D4F><#8799ae>.'
  no-permission: '<#FF4D4F>You do not have permission to use build mode.'

# ----------------------------------------------------------
# Jump and Run
# ----------------------------------------------------------
jumpandrun:
  start: '<#8799ae>Jump & Run <#2AF598>started</#2AF598><#8799ae>!'
  cancel: '<#8799ae>Jump & Run <#FF4D4F>canceled</#FF4D4F><#8799ae>.'
  finish: '<#8799ae>Jump & Run <#2AF598>completed</#2AF598><#8799ae> in <#FFFFFF>{time}</#FFFFFF>! <#F6C35D>Congratulations!'
  no-permission: '<#FF4D4F>You do not have permission to start Jump & Run.'
  already-active: '<#8799ae>You <#FF4D4F>already</#FF4D4F><#8799ae> have an active Jump & Run.'
  step: '<#8799ae>Step <#2AF598>{current}</#2AF598><#8799ae>/<#FFFFFF>{total}'
  reset: '<#FF4D4F>You fell!</#FF4D4F> <#8799ae>Teleporting to the last checkpoint.</#8799ae>'
  checkpoint: '<#2AF598>Checkpoint reached:</#2AF598> <#FFFFFF>{current}</#FFFFFF>/<#FFFFFF>{total}</#FFFFFF>'
  new-record: '<#F6C35D>New personal best!</#F6C35D>'
  item-name: '<#FFFFFF><bold>🞂 <gradient:#2AF598:#009EFD>Jump & Run</gradient></bold>'
  item-lore:
    - '<#8799ae>Right-click to start'
    - '<#8799ae>a Jump & Run route'
  leaderboard:
    title: '<gradient:#2AF598:#009EFD><bold>Jump & Run • Top 10</bold></gradient>'
    line: '<#8799ae>{pos}. <#FFFFFF>{player}</#FFFFFF> <#8799ae>- {time}'
    empty: '<#8799ae>No runs recorded yet.</#8799ae>'


# ----------------------------------------------------------
# Fly Command
# ----------------------------------------------------------
fly:
  enabled: '<#2AF598>Flight enabled.</#2AF598>'
  disabled: '<#FF4D4F>Flight disabled.</#FF4D4F>'
  target-enabled: '<#2AF598>Flight enabled for <#FFFFFF>{player}</#FFFFFF>.</#2AF598>'
  target-disabled: '<#FF4D4F>Flight disabled for <#FFFFFF>{player}</#FFFFFF>.</#FF4D4F>'
  disabled-command: '<#FF4D4F>The fly command is currently disabled.</#FF4D4F>'
  not-player: '<#FF4D4F>Only players can toggle their own flight.</#FF4D4F>'
  offline: '<#FF4D4F>That player is not online.</#FF4D4F>'
  no-permission: '<#FF4D4F>You do not have permission to fly.</#FF4D4F>'
  no-permission-others: '<#FF4D4F>You do not have permission to change other players'' flight.</#FF4D4F>'
  creative: '<#FF4D4F>You cannot disable flight for creative or spectator players.</#FF4D4F>'
  usage: '<gray>Usage:</gray> <white>/fly [player] [on|off|toggle]</white>'
  auto-enabled: '<#8799ae>Flight enabled automatically.</#8799ae>'

# ----------------------------------------------------------
# Double Jump
# ----------------------------------------------------------
doublejump:
  cooldown: '<#8799ae>Double jump cooldown: <#FF4D4F>{time}s</#FF4D4F><#8799ae>.'

# ----------------------------------------------------------
# Navigator
# ----------------------------------------------------------
navigator:
  title: '<gradient:#2AF598:#009EFD>Navigator</gradient>'
  item-name: '<#FFFFFF><bold>{name}</bold>'
  item-lore:
    - '<#8799ae>Right-click to open'
    - '<#8799ae>the navigator'
  items:
    navigator:
      name: "<#FFFFFF><bold>✦ <gradient:#2AF598:#009EFD>Navigator</gradient></bold>"
  actionbar: '<#8799ae>Connecting to <#FFFFFF>{server}</#FFFFFF><#8799ae>...'

# ----------------------------------------------------------
# Vanish
# ----------------------------------------------------------
vanish:
  enabled: '<#8799ae>You are now <green>vanished</green>.'
  disabled: '<#8799ae>You are now <red>visible</red>.'
  still-vanished: '<#8799ae>You are still <green>vanished</green>.'
  private:
    title: '<gray>Welcome (vanished)</gray>'
    subtitle: '<#8799ae>You are hidden.</#8799ae>'

# ----------------------------------------------------------
# Signs
# ----------------------------------------------------------
signs:
  no-permission: '<#FF4D4F>You do not have permission to use colored signs.'

# ----------------------------------------------------------
# JumpPads
# ----------------------------------------------------------
jumppads:
  launch: '<#8799ae>Wheee! 🚀</#8799ae>'

# ----------------------------------------------------------
# Player Hider
# ----------------------------------------------------------
playerHider:
  item:
    name: '<#FFFFFF><bold>👁 <gradient:#2AF598:#009EFD>Player Hider</gradient></bold>'
    lore:
      - '<#8799ae>Right-click to choose'
      - '<#8799ae>who you can see'
  gui:
    title: '<gradient:#2AF598:#009EFD>Player Hider</gradient>'
    all: '<green>Show everyone</green>'
    vip: '<gold>VIP only</gold>'
    none: '<red>Show no one</red>'
  set:
    all: '<#8799ae>Visibility: <#2AF598>Everyone</#2AF598>'
    vip: '<#8799ae>Visibility: <#F6C35D>VIP only</#F6C35D>'
    none: '<#8799ae>Visibility: <#FF4D4F>No one</#FF4D4F>'

# ----------------------------------------------------------
# Welcome / Join / Quit
# ----------------------------------------------------------
welcome:
  join: '<#2AF598>[+]</#2AF598> <#FFFFFF>{player}'
  quit: '<#FF4D4F>[-]</#FF4D4F> <#FFFFFF>{player}'
  first:
    toPlayer: '<gradient:#2AF598:#009EFD>Welcome</gradient> <#FFFFFF>{player} <#8799ae>to the network!'
    broadcast: '<#F6C35D>Everyone welcome <#FFFFFF>{player}</#FFFFFF> <#F6C35D>!'
  effects:
    title: '<gradient:#4FACFE:#00F2FE>Welcome</gradient>'
    subtitle: '<#8799ae>to <#FFFFFF>Syntrix</#FFFFFF><#8799ae>!'

# ----------------------------------------------------------
# Commands
# ----------------------------------------------------------
commands:
  spawn:
    success: '<#8799ae>Teleported to <#FFFFFF>spawn</#FFFFFF><#8799ae>.'
    teleport: '<#8799ae>Teleported to <#FFFFFF>spawn</#FFFFFF><#8799ae>.'
  setspawn:
    saved: '<#2AF598>Spawn set successfully.</#2AF598>'
    success: '<#2AF598>Spawn set successfully.</#2AF598>'
  setheight:
    updated: '<#2AF598>Death height set to</#2AF598> <#FFFFFF>{height}</#FFFFFF><#8799ae>.'
    killed: '<#8799ae>You fell below the allowed height.'
  lobbyreload:
    reloaded: '<#2AF598>Lobby reloaded successfully</#2AF598> <#8799ae>in <#FFFFFF>{time}ms</#FFFFFF><#8799ae>.'
    success: '<#2AF598>Lobby reloaded successfully</#2AF598> <#8799ae>in <#FFFFFF>{time}ms</#FFFFFF><#8799ae>.'
  leaderboard:
    commands:
      usage: '<gray>Usage:</gray> <white>/jumpandrunholo <spawn|remove|update></white>'
      created: '<#2AF598>Jump & Run hologram spawned.</#2AF598>'
      removed: '<#FF4D4F>Jump & Run hologram removed.</#FF4D4F>'
      updated: '<#2AF598>Jump & Run hologram updated.</#2AF598>'
      no-permission: '<#FF4D4F>You do not have permission to manage the leaderboard hologram.</#FF4D4F>'
      player-only: '<#FF4D4F>Only players can perform this action.</#FF4D4F>'


  playerinfo:
    usage: '<#8799ae>Usage:</#8799ae> <#FFFFFF>/playerinfo playerName</#FFFFFF> <#8799ae>or</#8799ae> <#FFFFFF>/playerinfo #123</#FFFFFF> <#8799ae>or</#8799ae> <#FFFFFF>/playerinfo id 123</#FFFFFF>'
    ip-usage: '<#8799ae>Usage:</#8799ae> <#FFFFFF>/playerinfo ip playerName</#FFFFFF> <#8799ae>or</#8799ae> <#FFFFFF>/playerinfo ip #123</#FFFFFF> <#8799ae>or</#8799ae> <#FFFFFF>/playerinfo ip id 123</#FFFFFF>'
    header: '<gradient:#2AF598:#009EFD>Syntrix</gradient> <#8799ae>• Spielerinfo für <#FFFFFF>{player}</#FFFFFF> <#8799ae>(ID #{id})</#8799ae>'
    section-divider: '<#2A3344>───────────────────────────────────</#2A3344>'
    sections:
      profile:
        title: '<gradient:#04c3e0:#0a92f1><bold>Profil</bold></gradient>'
        name: '  <#8799ae>Name:</#8799ae> <#FFFFFF>{player}</#FFFFFF>'
        uuid: '  <#8799ae>UUID:</#8799ae> <#FFFFFF>{uuid}</#FFFFFF>'
        status: '  <#8799ae>Status:</#8799ae> {status}'
        last-ip: '  <#8799ae>Letzte IP:</#8799ae> <#FFFFFF>{last_ip}</#FFFFFF>'
      activity:
        title: '<gradient:#04c3e0:#0a92f1><bold>Aktivität</bold></gradient>'
        first-join: '  <#8799ae>Erster Login:</#8799ae> <#FFFFFF>{first_join}</#FFFFFF>'
        last-join: '  <#8799ae>Letzter Login:</#8799ae> <#FFFFFF>{last_join}</#FFFFFF>'
        last-quit: '  <#8799ae>Logout:</#8799ae> <#FFFFFF>{last_quit}</#FFFFFF>'
        login-streak: '  <#8799ae>Streak:</#8799ae> <#FFFFFF>{login_streak}</#FFFFFF>'
        total-joins: '  <#8799ae>Logins gesamt:</#8799ae> <#FFFFFF>{total_joins}</#FFFFFF>'
      playtime:
        title: '<gradient:#04c3e0:#0a92f1><bold>Spielzeit</bold></gradient>'
        total: '  <#8799ae>Gesamt:</#8799ae> <#FFFFFF>{playtime_total}</#FFFFFF>'
        ranges: '  <#8799ae>24h:</#8799ae> <#FFFFFF>{playtime_today}</#FFFFFF> <#8799ae>| 7d:</#8799ae> <#FFFFFF>{playtime_7d}</#FFFFFF> <#8799ae>| 30d:</#8799ae> <#FFFFFF>{playtime_30d}</#FFFFFF>'
        session: '  <#8799ae>Aktuelle Session:</#8799ae> <#FFFFFF>{session_duration}</#FFFFFF> <#8799ae>(AFK {session_afk})</#8799ae>'
      connection:
        title: '<gradient:#04c3e0:#0a92f1><bold>Verbindung</bold></gradient>'
        ping: '  <#8799ae>Ping:</#8799ae> <#FFFFFF>{session_ping_current}</#FFFFFF> <#8799ae>(Ø {session_ping_average} • Min {session_ping_min} • Max {session_ping_max})</#8799ae>'
        tps: '  <#8799ae>Server:</#8799ae> <#FFFFFF>{session_last_tps}</#FFFFFF> <#8799ae>(Join TPS {session_join_tps} • Join Ping {session_join_ping})</#8799ae>'
        client: '  <#8799ae>Client:</#8799ae> <#FFFFFF>{client_version}</#FFFFFF> <#8799ae>(Protocol {client_protocol} • {client_platform})</#8799ae>'
        brand: '  <#8799ae>Brand:</#8799ae> <#FFFFFF>{client_brand}</#FFFFFF>'
        mods: '  <#8799ae>Mods:</#8799ae> <#FFFFFF>{client_mods}</#FFFFFF>'
      extras:
        title: '<gradient:#04c3e0:#0a92f1><bold>Extras</bold></gradient>'
        heatmap: '  <#8799ae>Login-Zeiten:</#8799ae> <#FFFFFF>{heatmap_summary}</#FFFFFF>'
        heatmap-detail: '  <#8799ae>Details:</#8799ae> <#FFFFFF>{heatmap_details}</#FFFFFF>'
    status:
      line: '<#8799ae>Status:</#8799ae> {status}'
      online: '<#2AF598>online</#2AF598>'
      offline: '<#FF4D4F>offline</#FF4D4F>'
    platform:
      bedrock: '<#FFA94D>Bedrock</#FFA94D>'
      java: '<#2AF598>Java</#2AF598>'
    alts:
      header: '<gradient:#04c3e0:#0a92f1><bold>Verdächtige Accounts</bold></gradient>'
      entry: '  <#FFFFFF>{name}</#FFFFFF> <#8799ae>({ips} • {last_seen})</#8799ae>'
      none: '  <#8799ae>Keine Übereinstimmungen gefunden.</#8799ae>'
    ip-history:
      header: '<gradient:#2AF598:#009EFD>Syntrix</gradient> <#8799ae>• IP-Historie für <#FFFFFF>{player}</#FFFFFF>:</#8799ae>'
      entry: '  <#FFFFFF>{ip}</#FFFFFF> <#8799ae>({first_seen} → {last_seen}, {uses} Logins)</#8799ae>'
      none: '  <#8799ae>Keine gespeicherten IP-Adressen.</#8799ae>'
    heatmap:
      none-detail: 'Keine aktuellen Login-Daten.'
    not-found: '<#FF4D4F>No database record for that player.</#FF4D4F>'
    invalid-id: '<#FF4D4F>Please provide a numeric player ID (for example 12 or #12).</#FF4D4F>'
    database-disabled: '<#FF4D4F>The database system is disabled.</#FF4D4F>'
    not-available: '<#8799ae>N/A</#8799ae>'
    error: '<#FF4D4F>Database error while fetching player info.</#FF4D4F>'

  time:
    usage: '<gray>Usage:</gray> <white>/time set <ticks></white> | <white>/time auto on|off</white> | <white>/time lock <ticks></white>'
    set:
      ok: '<#2AF598>Time set to <#FFFFFF>{ticks}</#FFFFFF>.</#2AF598>'
    auto:
      enabled: '<#2AF598>Automatic time-lock enabled</#2AF598> <#8799ae>(fixed=<#FFFFFF>{ticks}</#FFFFFF>).'
      disabled: '<#FF4D4F>Automatic time-lock disabled.</#FF4D4F>'
    lock:
      updated: '<#2AF598>Fixed time updated to <#FFFFFF>{ticks}</#FFFFFF> and task restarted.</#2AF598>'
  skull:
    display: '<#FFFFFF><bold>Head</bold>'
    done: '<#2AF598>Gave <#FFFFFF>{receiver}</#FFFFFF> the head of <#FFFFFF>{name}</#FFFFFF> x{amount}.'
    error: '<#FF4D4F>Could not load skin for <#FFFFFF>{name}</#FFFFFF>.'

# ----------------------------------------------------------
# Errors
# ----------------------------------------------------------
errors:
  no-permission: '<#FF4D4F>You do not have permission to do this.'
  player-only: '<#FF4D4F>This command can only be used by players.'
  not-found: '<#FF4D4F>Command or player not found.'
  internal: '<#FF4D4F>Database error while fetching player info.'